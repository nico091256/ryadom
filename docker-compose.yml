services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: localshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: localshop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d localshop"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: localshop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: localshop-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/localshop?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Required: generate with `openssl rand -hex 32` and put it in the root .env (compose reads it automatically).
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required - put it in .env}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      # Required: the mock provider issues the fixed OTP 123456, so production must use the real gateway.
      - SMS_PROVIDER=${SMS_PROVIDER:?SMS_PROVIDER=eskiz is required for the production container}
      - ESKIZ_EMAIL=${ESKIZ_EMAIL:-}
      - ESKIZ_PASSWORD=${ESKIZ_PASSWORD:-}
      - ONLINE_PAYMENTS_ENABLED=false
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api_uploads:/app/apps/backend/uploads

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: localshop-admin
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
    depends_on:
      - api

  store:
    build:
      context: .
      dockerfile: apps/store/Dockerfile
    container_name: localshop-store
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  api_uploads:
