name: mobile_client
description: "Ryadom customer app: find nearby shops, order, track delivery."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Shared business logic (order state machine, formatting) with backend
  localshop_shared:
    path: ../../packages/shared_dart

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Realtime
  socket_io_client: ^3.1.2

  # Location & maps
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Push notifications (no-ops gracefully until a Firebase project is configured)
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

  # Media
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Misc device/platform integrations
  url_launcher: ^6.3.1
  vibration: ^2.0.1
  intl: ^0.19.0
  uuid: ^4.5.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  flutter_svg: ^2.3.0
  lucide_icons_flutter: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
